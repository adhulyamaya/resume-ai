{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center my-3" style="min-height: 100vh;">
    <div class="card p-4 shadow-lg rounded" style="width: 400px; background-color: #000000;">
        <h2 class="text-center mb-3" style="color: white;">Sign Up</h2>

        {% if messages %}
            <div class="alert alert-info">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Full Name -->
            <div class="mb-3">
                <label class="form-label" style="color: white;">Full Name</label>
                <input type="text" name="fullname" class="form-control" placeholder="Enter your full name" value="{{ request.POST.fullname }}" required>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label" style="color: white;">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="Enter your email" value="{{ request.POST.email }}" required>
            </div>

            <!-- Phone -->
            <div class="mb-3">
                <label class="form-label" style="color: white;">Phone Number</label>
                <input type="text" name="phone_number" class="form-control" placeholder="Enter your phone number" value="{{ request.POST.phone_number }}" required>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label" style="color: white;">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <!-- Role -->
            <div class="mb-3">
                <label class="form-label" style="color: white;">Role</label>
                <select name="role" id="role" class="form-select" required onchange="toggleFields()">
                    <option value="" disabled {% if not request.POST.role %}selected{% endif %}>Select a role</option>
                    <option value="candidate" {% if request.POST.role == "candidate" %}selected{% endif %}>Candidate</option>
                    <option value="recruiter" {% if request.POST.role == "recruiter" %}selected{% endif %}>Recruiter</option>
                </select>
            </div>

            <!-- Candidate Section -->
            <div id="candidate-fields" style="display: none;">
                <h5 class="mt-3" style="color: white;">Candidate Details</h5>

                <div class="mb-3">
                    <label class="form-label" style="color: white;">Upload Resume</label>
                    <input type="file" name="resume" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label" style="color: white;">Skills</label>
                    <textarea name="skill" class="form-control" rows="2">{{ request.POST.skill }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label" style="color: white;">Experience</label>
                    <select name="exp" class="form-select">
                        <option value="" disabled {% if not request.POST.exp %}selected{% endif %}>Select experience</option>
                        <optgroup label="Entry Level">
                            <option value="0" {% if request.POST.exp == '0' %}selected{% endif %}>0 years (Fresher)</option>
                            <option value="1" {% if request.POST.exp == '1' %}selected{% endif %}>1 year</option>
                            <option value="2" {% if request.POST.exp == '2' %}selected{% endif %}>2 years</option>
                        </optgroup>
                        <optgroup label="Mid-Level">
                            <option value="3" {% if request.POST.exp == '3' %}selected{% endif %}>3 years</option>
                            <option value="4" {% if request.POST.exp == '4' %}selected{% endif %}>4 years</option>
                            <option value="5" {% if request.POST.exp == '5' %}selected{% endif %}>5 years</option>
                        </optgroup>
                        <optgroup label="Senior Level">
                            <option value="5-10" {% if request.POST.exp == '5-10' %}selected{% endif %}>5-10 years</option>
                            <option value="10+" {% if request.POST.exp == '10+' %}selected{% endif %}>10+ years</option>
                        </optgroup>
                    </select>
                </div>
            </div>

            <!-- Recruiter Section -->
            <div id="recruiter-fields" style="display: none;">
                <h5 class="mt-3" style="color: white;">Recruiter Details</h5>

                <div class="mb-3">
                    <label class="form-label" style="color: white;">Company Name</label>
                    <input type="text" name="company_name" class="form-control" value="{{ request.POST.company_name }}">
                </div>

                <div class="mb-3">
                    <label class="form-label" style="color: white;">Company Email</label>
                    <input type="email" name="company_email" class="form-control" value="{{ request.POST.company_email }}">
                </div>

                <div class="mb-3">
                    <label class="form-label" style="color: white;">Company Address</label>
                    <textarea name="address" class="form-control" rows="2">{{ request.POST.address }}</textarea>
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100 mt-3" style="color: white;">Sign Up</button>
        </form>

        <p class="text-center mt-3" style="color: white;">
            Already have an account? <a href="{% url 'user:login' %}" style="color: #1ed760;">Login</a>
        </p>
    </div>
</div>

<script>
    function toggleFields() {
        const role = document.getElementById("role").value;
        document.getElementById("candidate-fields").style.display = (role === "candidate") ? "block" : "none";
        document.getElementById("recruiter-fields").style.display = (role === "recruiter") ? "block" : "none";
    }

    document.addEventListener("DOMContentLoaded", function () {
        toggleFields();  // Show correct section on reload
    });
</script>
{% endblock %}
